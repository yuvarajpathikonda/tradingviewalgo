name: Download Docker Logs

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest

    steps:

    - name: Create logs directory
      run: mkdir -p logs

    - name: Fetch Docker logs from server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          mkdir -p /home/ubuntu/logs
          docker ps --format "{{.Names}}" > container_list.txt

          for container in $(cat container_list.txt); do
            echo "Fetching logs for $container"
            docker logs $container > /home/ubuntu/logs/$container.log 2>&1
          done

    - name: Copy logs from server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "/home/ubuntu/logs/*"
        target: "./logs"

    - name: Upload logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: logs/
