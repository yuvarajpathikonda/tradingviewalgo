name: Download Logs and State File

on:
  workflow_dispatch:

jobs:
  fetch-files:
    runs-on: ubuntu-latest

    steps:

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Prepare files on server
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
        ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

        # Create bundle folder
        mkdir -p /home/ubuntu/logs_bundle

        # Collect docker logs
        mkdir -p /home/ubuntu/logs_bundle/docker_logs
        docker ps --format "{{.Names}}" > /home/ubuntu/container_list.txt

        for c in $(cat /home/ubuntu/container_list.txt); do
          docker logs $c > /home/ubuntu/logs_bundle/docker_logs/$c.log 2>&1
        done

        # Copy your JSON file
        cp /home/ubuntu/workspace/tradingviewalgo/app/tv_bridge_state.json \
           /home/ubuntu/logs_bundle/ 2>/dev/null || echo "JSON file not found"

        # Create tar
        cd /home/ubuntu
        tar -czf logs_bundle.tar.gz logs_bundle

        EOF

    - name: Download bundle from server
      run: |
        mkdir -p logs
        scp -o StrictHostKeyChecking=no \
        -i ~/.ssh/id_rsa \
        ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/logs_bundle.tar.gz ./logs/

    - name: Extract bundle
      run: |
        tar -xzf logs/logs_bundle.tar.gz -C logs

    - name: Upload as artifact
      uses: actions/upload-artifact@v4
      with:
        name: logs-and-state
        path: logs/
