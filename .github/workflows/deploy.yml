name: Deploy TradingView Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t tradingview_algo .

    - name: Deploy Docker Image Directly
      run: |
        docker save tradingview_algo | ssh -o StrictHostKeyChecking=no \
          -i ${{ secrets.SERVER_SSH_KEY }} \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "docker load && \
          docker stop tradingview_algo || true && \
          docker rm tradingview_algo || true && \
          docker run -d \
            --restart always \
            -p 8000:8000 \
            --env-file .env \
            --name tradingview_algo \
            tradingview_algo"