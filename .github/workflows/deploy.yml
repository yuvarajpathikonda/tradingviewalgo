name: CI-CD Deploy

on:
  push:
    branches:
      - mahesh_main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tradingviewalgo .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up secret file
        env:
          DEBUG_PASSWORD: ${{ secrets.SERVER_IP }}
        run: |
          echo $DEBUG_PASSWORD >> secrets.txt
  
      - name: Run tmate
        uses: mxschmitt/action-tmate@v2
        
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            pwd
            echo ${{ secrets.SERVER_IP }}
            cd /home/ubuntu/tradingviewalgo
            git pull origin mahesh_main
            docker compose down
            docker compose up -d --build
            docker image prune -f
