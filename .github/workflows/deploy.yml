- name: Deploy Docker Image Directly
  run: |
    # Write SSH key
    echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/id_rsa
    chmod 600 /tmp/id_rsa

    # Copy .env to server
    scp -o StrictHostKeyChecking=no -i /tmp/id_rsa .env \
      ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/.env

    # Deploy Docker container
    docker save tradingview_algo | ssh -o StrictHostKeyChecking=no -i /tmp/id_rsa \
      ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "docker load && \
      docker stop tradingview_algo || true && \
      docker rm tradingview_algo || true && \
      docker run -d \
        --restart always \
        -p 8000:8000 \
        --env-file /home/ubuntu/.env \
        --name tradingview_algo \
        tradingview_algo"